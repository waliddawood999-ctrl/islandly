name: T10 Islamic backend verification
on:
  pull_request:
    branches: [dev, codex/T17-integration, codex/T18-sac-reputation, codex/T19-contracts, codex/T20-laptop-fixes, codex/T21-native-motion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-islamic:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        probe: [full, intl-only]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Real IPC and sender authorization
        run: npx electron test/islamic-ipc.js
      - name: Cold incremental service RAM and idle network budget
        env:
          ISLANDLY_ISLAMIC_PROBE: ${{ matrix.probe }}
        run: npx electron test/islamic-memory.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t10-islamic-memory-${{ matrix.probe }}
          path: islamic-memory-*.json
          if-no-files-found: warn
