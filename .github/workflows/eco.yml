name: T14 Eco backend verification
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Real Electron Eco and performance IPC
        run: npx electron test/eco-electron.js
