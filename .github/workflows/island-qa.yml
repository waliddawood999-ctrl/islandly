name: T24 island requirements QA
on:
  pull_request:
    branches: [codex/T21-native-motion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [overlay, reserved-bar]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - shell: pwsh
        run: ./scripts/build-native.ps1
      - name: Deterministic fullscreen observation and invalidation regressions
        shell: pwsh
        run: ./test/native-fullscreen-policy.ps1
      - name: Real foreground, top-edge reveal, Windows themes and composited open/close frames
        shell: pwsh
        run: ./test/island-requirements.ps1 -Mode ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t24-desktop-${{ matrix.mode }}
          path: out/t24
          if-no-files-found: error
  shape-and-layout:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - shell: pwsh
        run: ./scripts/build-native.ps1
      - name: Every 60Hz open/close frame, exact rounded-shape alpha, light/dark and RTL/LTR
        shell: pwsh
        run: ./test/island-shape-qa.ps1
      - name: Re-render native eyes and context frames for all renderer scenes
        shell: pwsh
        run: ./test/native-motion-qa.ps1
      - run: npx playwright install chromium
      - name: Full portrait/content/collision audit at100/125/150 percent (both languages, themes, materials and modes)
        shell: pwsh
        run: |
          $env:CHROMIUM_PATH=(& node -p "require('playwright').chromium.executablePath()")
          $env:T21_VISUAL_OUT="$PWD/out/t24/layout"
          node test/t20-visual.cjs
          if($LASTEXITCODE-ne 0){throw 'Portrait/content geometry or screenshot audit failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t24-shape-and-layout
          path: |
            out/t24
            out/t21/screenshots
          if-no-files-found: error
