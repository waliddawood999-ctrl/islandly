name: T7 Win32 surface verification
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Actual Win32 ABI and AppBar lifecycle
        run: npx electron test/win32-surface-native.js
