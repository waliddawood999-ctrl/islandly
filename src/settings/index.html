<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>Islandly</title>
  <link rel="stylesheet" href="../../assets/fonts/typography.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <!-- Every text comes from src/renderer/locales/<lang>.json through data-i18n (T11). -->
  <header class="top">
    <h1 data-i18n="settings.title"></h1>
    <div id="saved" class="toast" role="status" aria-live="polite"><i aria-hidden="true"></i><span data-i18n="settings.saved"></span></div>
    <nav id="nav" class="nav" data-i18n-aria-label="settings.nav"></nav>
  </header>

  <section id="perf" class="perf" data-nav>
    <h2 data-i18n="settings.performance"></h2>

    <div class="opt">
      <div class="opt-text">
        <label for="ecoMode" class="opt-title" data-i18n="settings.ecoMode"></label>
        <p class="hint" data-i18n="settings.eco.hint"></p>
      </div>
      <span class="switch"><input id="ecoMode" type="checkbox" role="switch"><i aria-hidden="true"></i></span>
    </div>
    <div class="opt sub">
      <div class="opt-text">
        <label for="ecoAuto" class="opt-title" data-i18n="settings.ecoAuto"></label>
        <p class="hint" data-i18n="settings.ecoAuto.hint"></p>
      </div>
      <span class="switch"><input id="ecoAuto" type="checkbox" role="switch"><i aria-hidden="true"></i></span>
    </div>
    <p id="ecoState" class="chip" data-state="inactive"><i class="chip-dot" aria-hidden="true"></i><span></span></p>

    <div class="opt stack" role="radiogroup" aria-labelledby="motionTitle">
      <div class="opt-text">
        <span id="motionTitle" class="opt-title" data-i18n="settings.motion"></span>
        <p class="hint" data-i18n="settings.motion.hint"></p>
      </div>
      <div class="seg" id="motion">
        <label><input type="radio" name="motion" value="full"><span data-i18n="settings.motion.full"></span></label>
        <label><input type="radio" name="motion" value="reduced"><span data-i18n="settings.motion.reduced"></span></label>
        <label><input type="radio" name="motion" value="off"><span data-i18n="settings.motion.off"></span></label>
      </div>
      <p id="motionNote" class="hint note" hidden data-i18n="settings.motion.ecoLimit"></p>
    </div>

    <div class="ram" id="ram" data-state="wait">
      <div class="ram-head">
        <span class="ram-title" data-i18n="settings.ram.title"></span>
        <span id="ramState" class="chip small" data-state="wait"><i class="chip-dot" aria-hidden="true"></i><span></span></span>
      </div>
      <div class="ram-total"><b id="ramTotal" class="tnum">—</b><span class="ram-unit" data-i18n="settings.ram.unit"></span></div>
      <ul id="ramRows" class="ram-rows"></ul>
      <p id="ramMeta" class="hint ram-meta"></p>
      <p class="hint" data-i18n="settings.ram.hint"></p>
    </div>
  </section>
  <section id="appearance" data-nav>
    <h2 data-i18n="settings.appearance"></h2>
    <div class="preview" id="preview" data-material="acrylic" data-mode="overlay" data-pos="center" aria-hidden="true">
      <span class="pv-cap" data-i18n="settings.preview"></span>
      <div class="pv-desk">
        <div class="pv-strip"></div>
        <div class="pv-win"><i></i><i></i><i></i></div>
        <div class="pv-pill"><span class="pv-live"></span><b id="pvTime" class="tnum"></b></div>
      </div>
    </div>
    <label><span data-i18n="settings.position"></span>
      <select id="position">
        <option value="center" data-i18n="settings.pos.center"></option>
        <option value="left" data-i18n="settings.pos.left"></option>
        <option value="right" data-i18n="settings.pos.right"></option>
      </select>
    </label>
    <label><span data-i18n="settings.autoHide"></span>
      <select id="autoHide">
        <option value="auto" data-i18n="settings.autoHide.auto" data-i18n-vars='{"n":5}'></option>
        <option value="always" data-i18n="settings.autoHide.always"></option>
        <option value="never" data-i18n="settings.autoHide.never"></option>
      </select>
    </label>
    <label><span data-i18n="settings.islandMode"></span>
      <select id="islandMode">
        <option value="overlay" data-i18n="settings.islandMode.overlay"></option>
        <option value="appbar" data-i18n="settings.islandMode.appbar"></option>
      </select>
    </label>
    <p class="hint" data-i18n="settings.islandMode.hint"></p>
    <label><span data-i18n="settings.material"></span>
      <select id="material">
        <option value="acrylic" data-i18n="settings.material.acrylic"></option>
        <option value="glass" data-i18n="settings.material.glass"></option>
      </select>
    </label>
    <p class="hint" id="materialHint" data-i18n="settings.material.unsupported" hidden></p>
    <label class="check"><input type="checkbox" id="hideFullscreen"> <span data-i18n="settings.hideFullscreen"></span></label>
    <label><span data-i18n="settings.scale"></span>
      <select id="scale">
        <option value="0.7" data-i18n="settings.scale.small"></option>
        <option value="0.8" data-i18n="settings.scale.medium"></option>
        <option value="1" data-i18n="settings.scale.large"></option>
      </select>
    </label>
    <label><span data-i18n="settings.language"></span>
      <select id="uiLang">
        <option value="auto" data-i18n="settings.lang.auto"></option>
        <!-- each language is named in itself, whatever the interface language -->
        <option value="ar" lang="ar" dir="rtl" data-i18n="settings.lang.ar"></option>
        <option value="en" lang="en" dir="ltr" data-i18n="settings.lang.en"></option>
      </select>
    </label>
    <label><span data-i18n="settings.digits"></span>
      <select id="digits">
        <option value="latn" data-i18n="settings.digits.latn"></option>
        <option value="arab" data-i18n="settings.digits.arab"></option>
      </select>
    </label>
    <p class="hint" data-i18n="settings.digits.hint"></p>
  </section>

  <section id="today" data-nav>
    <h2 data-i18n="settings.today"></h2>
    <label><span data-i18n="settings.city"></span>
      <select id="city"></select>
    </label>
    <div id="customBox" class="grid2" hidden>
      <label><span data-i18n="settings.lat"></span><input id="lat" type="number" step="0.0001" dir="ltr"></label>
      <label><span data-i18n="settings.lng"></span><input id="lng" type="number" step="0.0001" dir="ltr"></label>
      <label class="span2"><span data-i18n="settings.cityName"></span><input id="cityName" type="text" dir="auto"></label>
    </div>
    <label><span data-i18n="settings.prayerMethod"></span>
      <select id="prayerMethod">
        <option value="auto" data-i18n="settings.method.auto"></option>
        <option value="UmmAlQura" data-i18n="settings.method.UmmAlQura"></option>
        <option value="MuslimWorldLeague" data-i18n="settings.method.MuslimWorldLeague"></option>
        <option value="Egyptian" data-i18n="settings.method.Egyptian"></option>
        <option value="Kuwait" data-i18n="settings.method.Kuwait"></option>
        <option value="Qatar" data-i18n="settings.method.Qatar"></option>
        <option value="Dubai" data-i18n="settings.method.Dubai"></option>
        <option value="Karachi" data-i18n="settings.method.Karachi"></option>
        <option value="NorthAmerica" data-i18n="settings.method.NorthAmerica"></option>
        <option value="Turkey" data-i18n="settings.method.Turkey"></option>
      </select>
    </label>
    <label><span data-i18n="settings.madhab"></span>
      <select id="madhab">
        <option value="shafi" data-i18n="settings.madhab.shafi"></option>
        <option value="hanafi" data-i18n="settings.madhab.hanafi"></option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="prayerAlerts"> <span data-i18n="settings.prayerAlerts" data-i18n-vars='{"n":10}'></span></label>
    <label class="check"><input type="checkbox" id="weather"> <span data-i18n="settings.weather"></span></label>
  </section>

  <section id="health" data-nav>
    <h2 data-i18n="settings.health"></h2>
    <label><span data-i18n="settings.breakEvery"></span>
      <select id="breakEvery">
        <option value="0" data-i18n="settings.break.off"></option>
        <option value="30" data-i18n="settings.break.30" data-i18n-vars='{"n":30}'></option>
        <option value="45" data-i18n="settings.break.45" data-i18n-vars='{"n":45}'></option>
        <option value="60" data-i18n="settings.break.60"></option>
        <option value="90" data-i18n="settings.break.90"></option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="timeTracking"> <span data-i18n="settings.timeTracking"></span></label>
    <label class="check"><input type="checkbox" id="micCamIndicator"> <span data-i18n="settings.micCamIndicator"></span></label>
  </section>

  <section>
    <h2 data-i18n="settings.shortcutsTitle"></h2>
    <label><span data-i18n="settings.shortcuts"></span>
      <input id="shortcuts" type="text" dir="auto" data-i18n-placeholder="settings.shortcuts.placeholder">
    </label>
  </section>

  <section>
    <h2 data-i18n="settings.workspacesTitle"></h2>
    <p class="hint" data-i18n="settings.workspaces.hint"></p>
    <textarea id="workspaces" rows="4" dir="auto" data-i18n-placeholder="settings.workspaces.placeholder"></textarea>
  </section>

  <section id="keys" data-nav>
    <h2 data-i18n="settings.keys"></h2>
    <label><span data-i18n="settings.aiKey"></span>
      <div class="row"><input id="aiKey" type="password" dir="ltr" autocomplete="off"><button id="aiKeySave" type="button" data-i18n="settings.save"></button></div>
    </label>
    <p class="hint" id="aiKeyState"></p>
    <label><span data-i18n="settings.githubToken"></span>
      <div class="row"><input id="githubToken" type="password" dir="ltr" autocomplete="off"><button id="ghSave" type="button" data-i18n="settings.save"></button></div>
    </label>
    <p class="hint" id="ghState"></p>
  </section>

  <section>
    <h2 data-i18n="settings.calendarTitle"></h2>
    <label><span data-i18n="settings.icsUrl"></span>
      <input id="icsUrl" type="url" dir="ltr" data-i18n-placeholder="settings.ics.placeholder">
    </label>
    <p class="hint" data-i18n="settings.ics.hint"></p>
  </section>

  <section id="privacy" data-nav>
    <h2 data-i18n="settings.privacy"></h2>
    <label class="check"><input type="checkbox" id="clipboard"> <span data-i18n="settings.clipboard"></span></label>
  </section>

  <section id="updates" data-nav>
    <h2 data-i18n="settings.updates"></h2>
    <label class="check"><input type="checkbox" id="updates"> <span data-i18n="settings.autoUpdate"></span></label>
    <div class="row">
      <button id="check" data-i18n="settings.checkNow"></button>
      <span id="status" class="hint"></span>
    </div>
    <p class="hint" id="version"></p>
  </section>

  <section>
    <h2 data-i18n="settings.app"></h2>
    <button id="quit" class="danger" data-i18n="settings.quit"></button>
    <p class="hint" data-i18n="settings.quit.hint"></p>
  </section>

  <script src="../renderer/i18n-core.js"></script>
  <script src="settings.js"></script>
</body>
</html>
