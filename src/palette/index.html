<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:" />
  <title>Islandly</title>
  <link rel="stylesheet" href="palette.css" />
</head>
<body>
  <div id="box">
    <div class="bar">
      <span class="lead" id="lead"></span>
      <input id="q" type="text" autocomplete="off" spellcheck="false" dir="auto" />
      <kbd>Esc</kbd>
    </div>
    <div id="list" role="listbox"></div>
    <div id="answer" hidden>
      <div class="a-head"><span class="a-icon" id="aIcon"></span><span id="aTitle"></span><button id="aCopy" type="button"></button></div>
      <div id="aText" dir="auto"></div>
    </div>
  </div>
  <script src="palette.js"></script>
</body>
</html>
